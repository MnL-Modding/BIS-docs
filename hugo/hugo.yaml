baseUrl: 'https://mnl-modding.github.io/BIS-docs/'
languageCode: en-us
title: "Mario & Luigi: Bowser's Inside Story Documentation"

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      weight: 1
      pageRef: '/'
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: 'https://github.com/MnL-Modding/BIS-docs'
      params:
        icon: github
    - name: Discord
      weight: 4
      url: 'https://discord.gg/rhJ6HGyymJ'
      params:
        icon: discord

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: 'https://github.com/MnL-Modding/BIS-docs/edit/main/hugo/content'
